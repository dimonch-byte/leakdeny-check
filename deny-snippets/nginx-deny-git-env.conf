# Free starter snippet (nginx) — paste inside your server { } block, then `nginx -t && nginx -s reload`.
# Keeps /.well-known/ reachable (ACME, AASA, assetlinks) and returns 404 for common debris.
location ^~ /.well-known/ { allow all; }
location ~ /\.(git|svn|hg|env)(/|$|\.) { return 404; }
location ~* \.(sql|bak|map)$ { return 404; }
